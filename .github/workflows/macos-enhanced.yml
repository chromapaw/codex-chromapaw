name: macOS enhanced compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enhanced-test:
    name: ${{ matrix.arch }} enhanced harness
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            os: macos-15
          - arch: intel
            os: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-skin.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-skin.txt

      - name: Install renderer dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run enhanced macOS compatibility suite
        run: >-
          python3 scripts/macos_enhanced_test.py
          --output artifacts/macos-enhanced
          --force
          --json

      - name: Upload enhanced compatibility evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-enhanced-${{ matrix.arch }}
          path: artifacts/macos-enhanced
          if-no-files-found: error
          retention-days: 14
