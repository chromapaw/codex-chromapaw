name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-skin.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install release dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-skin.txt -r requirements-dev.txt

      - name: Verify tag, manifest, and changelog
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          public_version="$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"].split("+", 1)[0])')"
          test "$RELEASE_TAG" = "v$public_version"
          grep -Eq "^## ${public_version}([[:space:]]|$)" CHANGELOG.md
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Run release checks
        run: python scripts/release_check.py

      - name: Install tested Codex CLI
        run: npm install --global @openai/codex@0.144.2 --registry https://registry.npmjs.org

      - name: Run isolated plugin installation
        run: python scripts/smoke_test_install.py --source chromapaw/codex-chromapaw --ref "${GITHUB_REF_NAME}" --json

  publish:
    name: Publish source assets
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Prepare release directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/codex-chromapaw-${{ env.RELEASE_TAG }}.sbom.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Build reproducible source archives
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          prefix="codex-chromapaw-${version}/"
          git archive --format=zip --prefix="$prefix" HEAD > "dist/codex-chromapaw-${version}.zip"
          git archive --format=tar --prefix="$prefix" HEAD | gzip -9n > "dist/codex-chromapaw-${version}.tar.gz"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ChromaPaw ${RELEASE_TAG#v}" \
            --generate-notes
